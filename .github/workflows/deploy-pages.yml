name: Deploy to GitHub Pages

# 鎺ㄥ埌 main 灏辫嚜鍔ㄦ瀯寤哄苟鍙戝竷鍒?GitHub Pages銆?# 浠撳簱璁剧疆閲岄渶瑕佸仛涓€娆★細Settings 鈫?Pages 鈫?Source = GitHub Actions
#
# 娉ㄦ剰锛氬厤璐圭増 GitHub Pages 瑕佹眰浠撳簱鏄?public锛坧rivate 浠撳簱闇€瑕?Pro锛夈€?# 涓浗澶ч檰璁块棶 *.github.io 鏃跺揩鏃舵參锛涘鏋滃彂鐜颁笉绋冲畾锛屾妸杩欎釜鏂囦欢鎹㈡垚
# README銆岄儴缃层€嶄竴鑺傞噷鐨勫叾浠栫洰鏍囧嵆鍙紝鍓嶅洓姝ヤ笉鐢ㄦ敼銆?
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'data/**'
      - 'course_schedule.csv'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 鏋勫缓鍓嶅厛璺戞祴璇曪細鏁版嵁鎴栭€昏緫鍧忎簡灏变笉璇ュ彂鍒扮嚎涓?      - run: npm test

      - run: npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
