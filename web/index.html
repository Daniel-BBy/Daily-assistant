<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>每日简报</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="title">
        <h1 id="day">—</h1>
        <span id="week" class="badge" hidden></span>
      </div>
      <div class="controls">
        <input type="date" id="date" aria-label="选择日期">
        <button id="today" type="button">今天</button>
      </div>
      <div id="status" class="chips"></div>
    </header>

    <p id="error" class="error" hidden></p>

    <section class="card">
      <h2>课程</h2>
      <div id="course"></div>
    </section>

    <section class="card">
      <h2>天气</h2>
      <div id="weather"></div>
    </section>

    <footer>
      <p id="updated" class="muted small"></p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
