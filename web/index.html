<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>每日简报</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="title">
        <h1 id="day">—</h1>
        <span id="week" class="badge" hidden></span>
      </div>
      <div class="controls">
        <input type="date" id="date" aria-label="选择日期">
        <button id="today" type="button">今天</button>
      </div>
      <div id="status" class="chips"></div>
    </header>

    <p id="error" class="error" hidden></p>

    <section class="card">
      <h2>课程</h2>
      <div id="course"></div>
      <a class="checkin" id="checkin"
         href="https://ams.xjtlu.edu.cn/studenth5/#/home"
         target="_blank" rel="noopener noreferrer">
        <span class="checkin-dot" aria-hidden="true"></span>
        <span class="checkin-label" id="checkin-label">签到入口</span>
        <span class="checkin-arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <section class="card">
      <h2>天气</h2>
      <div id="weather"></div>
    </section>

    <section class="news-panel" id="news-panel" hidden>
      <header class="news-head">
        <div class="news-title">
          <span class="news-pulse" aria-hidden="true"></span>
          <h2>AI 早报</h2>
          <span class="news-issue" id="news-issue" hidden></span>
        </div>
        <span class="news-date" id="news-date"></span>
      </header>
      <ol class="news-list" id="news-list"></ol>
      <p class="news-foot" id="news-foot"></p>
      <nav class="news-archive" id="news-archive" hidden aria-label="往期早报">
        <h3>往期</h3>
        <ul id="news-archive-list"></ul>
      </nav>
    </section>

    <footer>
      <p id="updated" class="muted small"></p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
